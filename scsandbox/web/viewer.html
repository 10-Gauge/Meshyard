<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
    font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: none; }
  #view { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    padding: 14px; color: var(--fg); opacity: .8; text-align: center; white-space: pre-line; }
  #msg.corner { place-items: end start; opacity: .65; }
  :root { --fg: #e6e6e6; }
  :root.light { --fg: #1b1b1b; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/static/vendor/three/build/three.module.js",
  "three/addons/": "/static/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"><div id="msg"></div></div>
<script type="module">
  // The desktop app's 3D pane. The app drives it with window.viewer.* and hears back
  // through WebView2 messages ({type: "message", text, corner}).
  import { createViewer } from "/static/viewer.js";
  const msg = document.getElementById("msg");
  const host = window.chrome && window.chrome.webview;
  const v = createViewer(document.getElementById("view"), {
    onMessage(text, corner) {
      msg.textContent = text;
      msg.className = corner ? "corner" : "";
      if (host) host.postMessage({ type: "message", text, corner });
    },
  });
  window.viewer = {
    show: (url) => v.show(url),
    clear: (text) => { v.clear(); v.message(text || ""); },
    message: (text, corner) => v.message(text, !!corner),
    reset: () => v.resetView(),
    theme: (dark) => { document.documentElement.classList.toggle("light", !dark); v.setTheme(dark); },
  };
  const params = new URLSearchParams(location.search);
  window.viewer.theme(params.get("theme") !== "light");
  v.message(params.get("hint") || "");
  if (host) host.postMessage({ type: "ready" });
</script>
</body>
</html>
