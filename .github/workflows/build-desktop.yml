name: Build desktop app

on:
  push:
    branches: [main, asset-browser]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller
      - name: Tests
        run: python -m pytest -q
      - name: Build the engine, the WinUI 3 app and the bundled tools (packaging/build_exe.ps1)
        shell: pwsh
        run: |
          $env:SCSANDBOX_HOME = "$env:RUNNER_TEMP\sc-home"
          ./packaging/build_exe.ps1 -Python python -Name SC-Asset-Browser
          Get-Content "$env:SCSANDBOX_HOME\self-test.log"
      - uses: actions/upload-artifact@v4
        with:
          name: SC-Asset-Browser
          path: dist/SC-Asset-Browser.exe
      - name: Publish download (rolling "desktop-latest" pre-release)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --cleanup-tag -y || true
          gh release create desktop-latest "dist/SC-Asset-Browser.exe" \
            --prerelease --target "$GITHUB_SHA" --title "SC Asset Browser (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download SC-Asset-Browser.exe and double-click it: StarBreaker and cgf-converter are inside and unpack on first run. Blender is a separate free install, and the app links to it if it's missing. Windows SmartScreen may warn because the exe isn't code-signed: choose More info > Run anyway."
      - name: Publish numbered release (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/SC-Asset-Browser.exe" --verify-tag --latest \
            --title "SC Asset Browser $GITHUB_REF_NAME" \
            --notes-file "packaging/release-notes/$GITHUB_REF_NAME.md"
