[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-sandbox"
version = "1.2.0"
description = "Offline Star Citizen asset browser, Blender sandbox and 3D-print exporter for your own LIVE/PTU install"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "scikit-image>=0.21",
    "lxml>=4.9",
    "networkx>=3.0",
    "fast-simplification>=0.1.7",
    "pycollada>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sc-sandbox = "scsandbox.cli:main"

[tool.setuptools.packages.find]
include = ["scsandbox*"]

[tool.setuptools.package-data]
scsandbox = ["web/*", "web/vendor/**/*", "blender/*.py"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
